<svg xmlns="http://www.w3.org/2000/svg" width="272" height="64" viewBox="-18 -10 308 84" role="img" aria-labelledby="logo-title"><title id="logo-title">Shelves</title><style>
.book{animation:stack 650ms cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:center}
.bottom{animation-delay:80ms}.middle{animation-delay:240ms}.top{animation-delay:400ms}
.bookmark{animation:bookmark 550ms cubic-bezier(.22,1,.36,1) 800ms both;transform-origin:38px 3px}
.word{clip-path:inset(0 0 0 0);animation:reveal 850ms cubic-bezier(.22,1,.36,1) 650ms both}
@keyframes stack{0%{opacity:0;transform:translate(-16px,-10px) rotate(-8deg)}65%{opacity:1}100%{opacity:1;transform:translate(0,0) rotate(0)}}
@keyframes bookmark{0%{opacity:0;transform:translateY(-7px) scaleY(.25)}100%{opacity:1;transform:translateY(0) scaleY(1)}}
@keyframes reveal{0%{opacity:0;clip-path:inset(0 100% 0 0);transform:translateX(-6px)}100%{opacity:1;clip-path:inset(0 0 0 0);transform:translateX(0)}}
@media(prefers-reduced-motion:reduce){.book,.bookmark,.word{animation:none!important;opacity:1;transform:none;clip-path:none}}
